    <div style="position:sticky;top:16px">
      <div class="panel">
        <h2>Link für OBS</h2>
        <div class="urlbox"><input type="text" id="out" readonly><button id="copy" type="button">Kopieren</button></div>
        <p class="hint">Browserquelle in OBS: Breite 1920, Höhe 1080 – Position und Größe stellt das Overlay selbst ein.</p>
        <div class="preview" id="prevbox"><iframe id="prev" title="Vorschau" tabindex="-1"></iframe></div>
        <div class="prevbar">
          <span class="hint" style="margin:0">Vorschau der ganzen Leinwand, verkleinert.</span>
          <label class="check" style="margin:0"><input type="checkbox" id="c-checker"> Schachbrett-Hintergrund</label>
        </div>
      </div>
    </div>
  </div>`;

  const $ = id => document.getElementById(id);
  const addOp = (code = "", clan = "") => {
    const row = document.createElement("div");
    row.className = "oprow";
    row.innerHTML = `<input placeholder="Code, z. B. C012" value="${esc(code)}"><input placeholder="Clan-ID (optional)" value="${esc(clan)}"><button class="ghost" type="button">✕</button>`;
    row.querySelector("button").onclick = () => { row.remove(); update(); };
    row.querySelectorAll("input").forEach(i => i.oninput = () => update());
    $("ops").appendChild(row);
  };
  $("add-op").onclick = () => { addOp(); update(); };

  // Gegenstück zu update(): setzt alle Felder aus Link-Parametern (fehlende Werte = Standard)
  const LOOK_KEYS = ["layout", "pos", "scale", "mx", "my", "margin", "bgalpha", "accent", "accent2", "briefing", "anim", "closed", "rotate", "brief", "briefh", "lang", "pulse"];
  function applyParams(q, withSources) {
    const g = (k, d) => q.has(k) ? q.get(k) : d;
    const layoutV = ["card", "bar", "counter"].includes(q.get("layout")) ? q.get("layout") : "card";
    $("c-layout").value = layoutV;
    $("c-pos").value = POS.includes(q.get("pos")) ? q.get("pos") : (layoutV === "bar" ? "bc" : "tl");
    $("c-scale").value = Math.round(clamp(Number(g("scale", 1)) || 1, 0.6, 1.8) * 100);
    $("c-mx").value = clamp(Number(g("mx", g("margin", 40))), 0, 400);
    $("c-my").value = clamp(Number(g("my", g("margin", 40))), 0, 400);
    $("c-bgalpha").value = q.has("bgalpha") ? clamp(Number(q.get("bgalpha")), 0, 100) : (q.get("bg") === "none" ? 0 : 85);
    const hex = (k, d) => /^[0-9a-f]{6}$/i.test(q.get(k) || "") ? "#" + q.get(k).toLowerCase() : d;
    $("c-accent").value = hex("accent", layoutV === "counter" ? "#ffc233" : "#ffe711");
    $("c-accent2").value = hex("accent2", "#c9a6ff");
    $("c-briefing").value = ({ "0": "off", off: "off", alt: "alt" })[q.get("briefing")] || "on";
    $("c-anim").value = q.get("anim") === "fold" ? "fold" : "none";
    $("c-closed").value = g("closed", 45);
    $("c-rotate").value = g("rotate", 12);
    $("c-brief").value = g("brief", 20);
    $("c-briefh").value = g("briefh", 220);
    $("c-lang").value = q.get("lang") === "en" ? "en" : "de";
    $("c-pulse").checked = q.get("pulse") !== "0";
    if (withSources) {
      if (q.get("contact")) $("c-contact").value = q.get("contact");
      $("c-demo").checked = q.get("demo") === "1";
      if (q.has("config")) { $("c-usefile").checked = true; $("c-file").value = q.get("config"); }
      const list = (q.get("sources") || "").split(",").map(x => x.trim()).filter(x => SRC_RE.test(x));
      if (list.length) fillEditor(list);
    }
  }
  const lookOnly = q => { const o = new URLSearchParams(); LOOK_KEYS.forEach(k => { if (q.has(k)) o.set(k, q.get(k)); }); return o; };

  // Eigene Presets (nur in diesem Browser)
  const MY_KEY = "hd2-mypresets";
  const readMy = () => { try { return JSON.parse(localStorage.getItem(MY_KEY) || "{}"); } catch (e) { return {}; } };
  const writeMy = m => { try { localStorage.setItem(MY_KEY, JSON.stringify(m)); } catch (e) {} };
  function renderMy() {
    const m = readMy();
    $("mypresets").innerHTML = Object.keys(m).sort((a, b) => a.localeCompare(b)).map(n =>
      `<button type="button" class="mp" data-my="${esc(n)}">${esc(n)}<small>${esc(describe(new URLSearchParams(m[n])))}</small><span class="mp-del" role="button" aria-label="${esc(n)} löschen" data-del="${esc(n)}">✕</span></button>`).join("");
    $("mypresets").querySelectorAll(".mp").forEach(b => b.onclick = ev => {
      const del = ev.target.closest("[data-del]");
      if (del) { const mm = readMy(); delete mm[del.dataset.del]; writeMy(mm); renderMy(); return; }
      applyParams(new URLSearchParams(readMy()[b.dataset.my] || ""), false);
      update(); markPreset("my:" + b.dataset.my);
    });
  }
  function describe(q) {
    const lay = { card: "Karte", bar: "Leiste", counter: "Event-Zähler" }[q.get("layout")] || "Karte";
    const pos = q.get("pos") || "tl";
    const posTxt = { t: "oben", m: "Mitte", b: "unten" }[pos[0]] + " " + { l: "links", c: "mittig", r: "rechts" }[pos[1]];
    return `${lay}, ${posTxt}${q.get("anim") === "fold" ? ", klappt ein" : ""}`;
  }
  $("p-save").onclick = () => {
    const name = $("c-pname").value.trim();
    if (!name) { $("c-pname").focus(); return; }
    const m = readMy(); m[name] = lookOnly(new URLSearchParams($("out").value.split("?")[1] || "")).toString(); writeMy(m);
    $("c-pname").value = ""; renderMy(); markPreset("my:" + name);
  };
  $("c-pname").addEventListener("keydown", e => { if (e.key === "Enter") $("p-save").click(); });
  $("p-import").onclick = () => {
    const raw = $("c-import").value.trim();
    let q;
    try { q = new URL(raw, location.href).searchParams; } catch (e) { q = null; }
    if (!q || ![...q.keys()].length) { $("import-status").textContent = "Das sieht nicht nach einem Overlay-Link aus."; return; }
    applyParams(q, true); update(); markPreset(null);
    $("import-status").textContent = "Übernommen ✔";
    if ($("c-usefile").checked && $("c-repo").value) loadFile();
  };
  $("p-reset").onclick = () => {
    try { localStorage.removeItem("hd2-last"); } catch (e) {}
    $("c-mo").checked = true; $("ops").innerHTML = ""; addOp(); $("c-demo").checked = false;
    applyParams(new URLSearchParams(), false); // alle Werte auf Standard, auch Abstände
    applyPreset("classic");
  };

  function markPreset(k) {
    document.querySelectorAll("#presets button").forEach(b => b.classList.toggle("on", b.dataset.p === k));
    document.querySelectorAll("#mypresets .mp").forEach(b => b.classList.toggle("on", "my:" + b.dataset.my === k));
  }
  function applyPreset(k) {
    const p = PRESETS[k];
    $("c-layout").value = p.layout; $("c-pos").value = p.pos; $("c-scale").value = p.scale;
    $("c-bgalpha").value = p.bgalpha; $("c-briefing").value = p.briefing; $("c-anim").value = p.anim;
    if (p.closed) $("c-closed").value = p.closed;
    $("c-accent").value = p.accent || "#ffe711";
    $("c-accent2").value = p.accent2 || "#c9a6ff";
    markPreset(k); update();
  }
  document.querySelectorAll("#presets button").forEach(b => b.onclick = () => applyPreset(b.dataset.p));
  document.querySelectorAll("#posgrid button").forEach(b => b.onclick = () => { $("c-pos").value = b.dataset.pos; update(true); });
  document.querySelectorAll(".swatches button").forEach(b => b.onclick = () => { $("c-accent").value = b.dataset.c; update(); });

  let timer;
  function update(fromUser) {
    if (fromUser) markPreset(null);
    const p = new URLSearchParams();
    const src = [];
    if ($("c-mo").checked) src.push("mo");
    document.querySelectorAll(".oprow").forEach(r => {
      const [code, clan] = [...r.querySelectorAll("input")].map(i => i.value.trim());
      if (/^[a-z]\d+$/i.test(code)) src.push("op:" + code.toUpperCase() + (/^\d+$/.test(clan) ? ":" + clan : ""));
    });
    p.set("sources", src.join(",") || "mo"); // Vorschau zeigt immer die Liste im Editor
    if ($("c-demo").checked) p.set("demo", "1");
    p.set("layout", $("c-layout").value);
    p.set("pos", $("c-pos").value);
    if (+$("c-scale").value !== 100) p.set("scale", (+$("c-scale").value / 100).toFixed(2));
    if (+$("c-mx").value !== 40) p.set("mx", $("c-mx").value);
    if (+$("c-my").value !== 40) p.set("my", $("c-my").value);
    p.set("bgalpha", $("c-bgalpha").value);
    const acc = $("c-accent").value.replace("#", "").toLowerCase();
    if (acc !== ($("c-layout").value === "counter" ? "ffc233" : "ffe711")) p.set("accent", acc);
    const acc2 = $("c-accent2").value.replace("#", "").toLowerCase();
    if (acc2 !== "c9a6ff") p.set("accent2", acc2);
    if ($("c-briefing").value !== "on") p.set("briefing", $("c-briefing").value);
    if ($("c-anim").value === "fold") { p.set("anim", "fold"); p.set("closed", $("c-closed").value); }
    if (+$("c-rotate").value !== 12) p.set("rotate", $("c-rotate").value);
    if ($("c-briefing").value === "alt" && +$("c-brief").value !== 20) p.set("brief", $("c-brief").value);
    if ($("c-briefing").value === "alt" && +$("c-briefh").value !== 220) p.set("briefh", $("c-briefh").value);
    if ($("c-lang").value !== "de") p.set("lang", $("c-lang").value);
    if ($("c-contact").value.trim()) p.set("contact", $("c-contact").value.trim());
    if (!$("c-pulse").checked) p.set("pulse", "0");
    $("o-scale").textContent = $("c-scale").value + " %";
    $("o-mx").textContent = $("c-pos").value[1] === "c" ? "– (Mitte)" : $("c-mx").value + " px";
    $("o-my").textContent = $("c-pos").value[0] === "m" ? "– (Mitte)" : $("c-my").value + " px";
    document.querySelectorAll("#posgrid button").forEach(b => b.setAttribute("aria-checked", String(b.dataset.pos === $("c-pos").value)));
    $("o-bgalpha").textContent = $("c-bgalpha").value + " %";
    document.documentElement.style.setProperty("--accent", $("c-accent").value);
    document.documentElement.style.setProperty("--on-accent", onAccent($("c-accent").value));
    $("prevbox").classList.toggle("check-bg", $("c-checker").checked);
    const base = location.href.split(/[?#]/)[0];
    const url = base + "?" + p.toString();
    // OBS-Link: im Datei-Modus statt der Liste die Datei (Link bleibt bei Änderungen gleich)
    const obs = new URLSearchParams(p);
    if ($("c-usefile").checked) { obs.delete("sources"); obs.set("config", $("c-file").value.trim() || "orders.json"); }
    $("out").value = base + "?" + obs.toString();
    try { localStorage.setItem("hd2-last", obs.toString() + ($("c-usefile").checked ? "&sources=" + encodeURIComponent(src.join(",")) : "")); } catch (e) {}
    $("filebox").hidden = !$("c-usefile").checked;
    $("file-hint").hidden = !($("c-usefile").checked && location.protocol === "file:");
    $("file-hint").textContent = "Hinweis: Du hast den Konfigurator lokal geöffnet. Damit der Link beim Streamer funktioniert, öffne ihn über eure GitHub-Pages-Adresse und kopiere den Link dort.";
    if ($("c-usefile").checked) markDirty(src);
    clearTimeout(timer);
    timer = setTimeout(() => { if ($("prev").src !== url) $("prev").src = url; }, 900);
  }
  function fitPreview() { $("prev").style.transform = `scale(${$("prevbox").clientWidth / 1920})`; }
  new ResizeObserver(fitPreview).observe($("prevbox"));
  document.querySelectorAll(".cfg input, .cfg select").forEach(x => {
    x.addEventListener("input", () => update(x.closest(".panel") && !["c-mo", "c-demo", "c-checker", "c-contact", "c-lang", "c-pulse", "c-usefile", "c-repo", "c-file", "c-token", "c-remember", "c-pname", "c-import"].includes(x.id)));
  });
  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText($("out").value); } catch (e) { $("out").select(); document.execCommand("copy"); }
    $("copy").textContent = "Kopiert ✔"; setTimeout(() => $("copy").textContent = "Kopieren", 1500);
  };
  /* ---- Orders-Datei über die GitHub-API lesen und schreiben ----
     Lesen geht bei öffentlichen Repositories ohne Token. Zum Speichern braucht jede Person
     (du, der Streamer) einen eigenen Fine-grained Token mit Schreibrecht nur für dieses Repository. */
  const GH = "https://api.github.com";
  let savedList = null;
  const fstatus = (t, cls) => { $("f-status").textContent = t; $("f-status").className = "hint " + (cls || ""); };
  const ghRepo = () => $("c-repo").value.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\.git$/, "").replace(/\/+$/, "");
  const ghPath = () => ($("c-file").value.trim() || "orders.json").split("/").map(encodeURIComponent).join("/");
  function ghHeaders(withToken) {
    const h = { Accept: "application/vnd.github+json" };
    const t = $("c-token").value.trim();
    if (withToken && t) h.Authorization = "Bearer " + t;
    return h;
  }
  const b64enc = str => btoa(unescape(encodeURIComponent(str)));
  const b64dec = str => decodeURIComponent(escape(atob(str.replace(/\n/g, ""))));
  function ghError(r) {
    if (r.status === 401) return "Token ungültig oder abgelaufen.";
    if (r.status === 403) return "Keine Berechtigung – hat der Token Schreibrecht (Contents: Read and write) für dieses Repository?";
    if (r.status === 404) return "Repository oder Datei nicht gefunden – Name prüfen (bei privaten Repositories braucht auch das Laden einen Token).";
    if (r.status === 409 || r.status === 422) return "Die Datei wurde gerade woanders geändert – bitte erneut laden.";
    return "GitHub antwortet mit Fehler " + r.status + ".";
  }
  async function ghGet() {
    if (!/^[\w.-]+\/[\w.-]+$/.test(ghRepo())) throw new Error("Bitte Repository als „name/repository\" eintragen.");
    const r = await fetch(`${GH}/repos/${ghRepo()}/contents/${ghPath()}?t=${Date.now()}`, { headers: ghHeaders(true), cache: "no-store" });
    if (r.status === 404 && $("c-token").value.trim()) return { sha: null, data: null }; // Datei gibt es noch nicht
    if (!r.ok) throw new Error(ghError(r));
    const j = await r.json();
    return { sha: j.sha, data: JSON.parse(b64dec(j.content || "")) };
  }
  function listFromEditor() {
    const src = [];
    if ($("c-mo").checked) src.push("mo");
    document.querySelectorAll(".oprow").forEach(r => {
      const [code, clan] = [...r.querySelectorAll("input")].map(i => i.value.trim());
      if (/^[a-z]\d+$/i.test(code)) src.push("op:" + code.toUpperCase() + (/^\d+$/.test(clan) ? ":" + clan : ""));
    });
    return src;
  }
  function fillEditor(list) {
    $("c-mo").checked = list.includes("mo");
    $("ops").innerHTML = "";
    list.filter(x => x.startsWith("op:")).forEach(x => { const q = x.split(":"); addOp(q[1], q[2] || ""); });
    if (!$("ops").children.length) addOp();
  }
  function markDirty(list) {
    if (savedList && list.join(",") !== savedList.join(",")) fstatus("Ungespeicherte Änderungen – zum Übernehmen „In Datei speichern\".", "warn");
  }
  function rememberSettings() {
    try {
      localStorage.setItem("hd2-file", JSON.stringify({ use: $("c-usefile").checked, repo: $("c-repo").value.trim(), file: $("c-file").value.trim() }));
      if ($("c-remember").checked && $("c-token").value.trim()) localStorage.setItem("hd2-ghtoken", $("c-token").value.trim());
      else localStorage.removeItem("hd2-ghtoken");
    } catch (e) {}
  }
  async function loadFile() {
    fstatus("Lade …");
    try {
      const { data } = await ghGet();
      const list = data && Array.isArray(data.sources) ? data.sources.filter(x => SRC_RE.test(String(x))) : null;
      if (!list) { fstatus("Datei gibt es noch nicht – trage Orders ein und speichere.", "warn"); savedList = []; return; }
      savedList = list;
      fillEditor(list);
      update();
      fstatus(`Geladen: ${list.length} Quelle(n).`, "ok");
    } catch (e) { fstatus(e.message, "bad"); }
  }
  async function saveFile() {
    rememberSettings();
    if (!$("c-token").value.trim()) { fstatus("Zum Speichern bitte deinen GitHub-Token eintragen.", "bad"); return; }
    const list = listFromEditor();
    if (!list.length) { fstatus("Bitte mindestens eine Quelle auswählen.", "bad"); return; }
    fstatus("Speichere …");
    const content = b64enc(JSON.stringify({ sources: list }, null, 2) + "\n");
    try {
      for (let attempt = 0; attempt < 2; attempt++) {
        const { sha } = await ghGet();
        const body = { message: "Orders aktualisiert: " + list.join(", "), content };
        if (sha) body.sha = sha;
        const r = await fetch(`${GH}/repos/${ghRepo()}/contents/${ghPath()}`, {
          method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders(true)), body: JSON.stringify(body),
        });
        if (r.ok) { savedList = list; fstatus("Gespeichert ✔ – das Overlay beim Streamer übernimmt die Orders in 1–2 Minuten.", "ok"); return; }
        if ((r.status === 409 || r.status === 422) && attempt === 0) continue; // jemand hat parallel gespeichert: neu versuchen
        throw new Error(ghError(r));
      }
    } catch (e) { fstatus(e.message, "bad"); }
  }
  $("f-load").onclick = loadFile;
  $("f-save").onclick = saveFile;
  ["c-repo", "c-file", "c-usefile", "c-remember"].forEach(id => $(id).addEventListener("change", rememberSettings));
  $("c-remember").addEventListener("change", () => { if (!$("c-remember").checked) try { localStorage.removeItem("hd2-ghtoken"); } catch (e) {} });

  try { const c = localStorage.getItem("hd2-contact"); if (c) $("c-contact").value = c; } catch (e) {}
  $("c-contact").addEventListener("change", () => { try { localStorage.setItem("hd2-contact", $("c-contact").value.trim()); } catch (e) {} });
  let lastSaved = null;
  try { lastSaved = localStorage.getItem("hd2-last"); } catch (e) {}
  addOp();
  if (lastSaved) { applyParams(new URLSearchParams(lastSaved), true); update(); } else applyPreset("classic");
  renderMy();
  fitPreview();
  let fileCfg = {};
  try { fileCfg = JSON.parse(localStorage.getItem("hd2-file") || "{}"); const t = localStorage.getItem("hd2-ghtoken"); if (t) { $("c-token").value = t; $("c-remember").checked = true; } } catch (e) {}
  // Auf GitHub Pages (name.github.io/repo/) das Repository automatisch vorbelegen
  const gh = location.hostname.match(/^([\w-]+)\.github\.io$/i);
  const autoRepo = gh ? `${gh[1]}/${location.pathname.split("/").filter(Boolean)[0] && !location.pathname.split("/").filter(Boolean)[0].endsWith(".html") ? location.pathname.split("/").filter(Boolean)[0] : gh[1] + ".github.io"}` : "";
  $("c-repo").value = fileCfg.repo || autoRepo;
  if (fileCfg.file) $("c-file").value = fileCfg.file;
  if (fileCfg.use || gh) $("c-usefile").checked = true;
  update();
  if ($("c-usefile").checked && $("c-repo").value) loadFile();
}

if (CFG.sources.length || CFG.configUrl) startOverlay(); else startSetup();
</script>
</body>
</html>
